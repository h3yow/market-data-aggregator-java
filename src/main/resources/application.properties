# ===== 行情聚合服务配置（market-data.*）=====
# K 线固定窗口大小（毫秒），窗口左闭右开 [start, start+size)
market-data.window-size-millis=1000
# 乱序/迟到容忍时长（毫秒）：行情时间戳早于水位超过该值即拒绝(REJECTED_STALE)
market-data.out-of-order-tolerance-millis=5000
# 增量拉取游标有效期（毫秒）
market-data.cursor-ttl-millis=3600000
# 游标签名 HMAC 密钥（本地演示默认值，生产必须覆盖）
market-data.cursor-secret=local-demo-secret-do-not-use-in-prod
# 启动时是否注入确定性本地逐笔行情脚本
market-data.injector-enabled=true
